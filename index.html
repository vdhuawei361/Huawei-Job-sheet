<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://*.googleusercontent.com; base-uri 'none'; form-action 'none'">
<title>Form2Chat</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f6;--card:#fff;--ink:#111827;--mut:#667085;--line:#d3d9e4;--acc:#2f4bff;--accink:#fff;--soft:#e3e8ff;--danger:#c2300f;--bar:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1422;--card:#182036;--ink:#eef1f8;--mut:#9aa5bd;--line:#2c3856;--acc:#7b90ff;--accink:#0b1020;--soft:#252f55;--danger:#ff7a5c;--bar:#182036}}
:root[data-theme="dark"]{--bg:#0f1422;--card:#182036;--ink:#eef1f8;--mut:#9aa5bd;--line:#2c3856;--acc:#7b90ff;--accink:#0b1020;--soft:#252f55;--danger:#ff7a5c;--bar:#182036}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "IBM Plex Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px;font-weight:600}
h2{font-size:17px;margin:0 0 10px;font-weight:600}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;font-weight:500;margin:12px 0 4px}
label:first-child{margin-top:0}
.rq{color:var(--danger)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:46px}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.chk{display:flex;align-items:center;gap:10px;font-weight:500;padding:6px 0}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;min-height:44px;font-weight:500}
button.pri{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button.line{background:#06c755;border-color:#06c755;color:#fff}
button.wa{background:#25d366;border-color:#25d366;color:#06240f}
button.del{color:var(--danger)}
button.sm{min-height:36px;padding:6px 10px;font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.chip{flex:none;border-radius:999px;padding:8px 14px;min-height:40px}
.chip.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
#out,#jout{font-family:ui-monospace,Menlo,Consolas,"IBM Plex Sans Thai",monospace;font-size:14px;min-height:170px;white-space:pre-wrap}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--mut);min-height:48px}
nav button.on{color:var(--acc);font-weight:600}
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .t{flex:1;min-width:0}
.item small{color:var(--mut);display:block}
.frow{border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px;background:var(--bg)}
.frow .row{margin-top:8px;align-items:center}
.frow .row>.fix{flex:none}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0;font:14px/1.45 "IBM Plex Sans Thai",sans-serif}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{min-height:56px}
.pill{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 12px;font-size:14px;font-weight:600}
.tl{border-left:3px solid var(--acc);margin:8px 0 0 6px;padding-left:12px}
.tl>div{padding:6px 0}
.tl small{display:block;color:var(--mut);word-break:break-all}
.tl a{color:var(--acc)}
.eta{margin:10px 0 0;font-weight:500}
details summary{cursor:pointer;font-weight:500;min-height:44px;display:flex;align-items:center}
.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid var(--line);border-radius:10px;min-height:44px;padding:10px 14px;font-weight:500;color:var(--ink);background:var(--card);flex:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const DEFAULT_URL='https://script.google.com/macros/s/AKfycby7xtHAya9P0My5q8AydT-Or6-0e6qQ2InAdB60ycnJ3CDokZLbIAcv81fSHACE0Fqewg/exec';
const gcfg=()=>{const g=store.get('f2c_g',{});return Object.assign({},g,{url:g.url||DEFAULT_URL})};
const TYPES={text:'Short text',long:'Long text',number:'Number',date:'Date',time:'Time',select:'Dropdown',check:'Yes / No'};
const F=(label,type,o={})=>Object.assign({id:uid(),label,type,req:false,opts:''},o);
const defaults=()=>[
 {id:'site',name:'Site visit report',emoji:'📍',stamp:false,fields:[F('Site ID','text',{req:true}),F('Region','select',{opts:'BMA, EAS, NOE'}),F('Date','date'),F('Time','time'),F('Issue','long',{req:true}),F('Status','select',{opts:'Open, In progress, Resolved'}),F('Action taken','long'),F('Needs follow-up','check')]},
 {id:'daily',name:'Daily update',emoji:'📝',stamp:true,fields:[F('Name','text',{req:true}),F('Done today','long',{req:true}),F('Blockers','long'),F('Plan for tomorrow','long')]}
];
let S={tpls:store.get('f2c_t',null)||defaults(),hist:store.get('f2c_h',[]),view:'fill',cur:null,vals:{},dirty:false,edit:null,job:store.get('f2c_j',null)||{id:uid(),title:'',events:[]},panel:null,incl:false};
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const nowT=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtD=s=>/^\d{4}-\d\d-\d\d$/.test(s||'')?s.split('-').reverse().join('/'):s;
const save=()=>{store.set('f2c_t',S.tpls);store.set('f2c_h',S.hist)};
const tpl=()=>S.tpls.find(t=>t.id===S.cur);
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}

function open(id){S.cur=id;S.dirty=false;S.vals={};const t=tpl();if(!t)return;t.fields.forEach(f=>{if(f.type==='date')S.vals[f.id]=today();if(f.type==='time')S.vals[f.id]=nowT();if(f.type==='check')S.vals[f.id]=false})}
function build(t,v){
 const L=[(t.emoji||'📋')+' '+t.name,''];
 t.fields.forEach(f=>{let x=v[f.id];
  if(f.type==='check')x=x?'✅ Yes':'❌ No';else if(f.type==='date')x=fmtD(x);
  if(x===undefined||x===null||x==='')return;
  L.push(f.type==='long'&&String(x).includes('\n')?f.label+':\n'+x:f.label+': '+x)});
 if(t.stamp)L.push('','🕒 '+fmtD(today())+' '+nowT());
 return L.join('\n').trim()}

function fieldHtml(f){
 const id='f_'+f.id,v=S.vals[f.id],lab=esc(f.label)+(f.req?'<b class="rq"> *</b>':'');
 if(f.type==='check')return `<label class="chk"><input type="checkbox" data-f="${f.id}" ${v?'checked':''}> ${lab}</label>`;
 let c;
 if(f.type==='long')c=`<textarea id="${id}" data-f="${f.id}" rows="3">${esc(v)}</textarea>`;
 else if(f.type==='select'){const o=(f.opts||'').split(',').map(s=>s.trim()).filter(Boolean);
  c=`<select id="${id}" data-f="${f.id}"><option value="">Choose…</option>${o.map(x=>`<option ${v===x?'selected':''}>${esc(x)}</option>`).join('')}</select>`}
 else c=`<input id="${id}" data-f="${f.id}" type="${f.type==='number'?'number':f.type}" ${f.type==='number'?'inputmode="decimal"':''} value="${esc(v)}">`;
 return `<label for="${id}">${lab}</label>${c}`}

function viewFill(){
 if(!S.tpls.length)return `<div class="empty">No templates yet. Create one in the Templates tab.</div>`;
 if(!tpl())open(S.tpls[0].id);
 const t=tpl();
 return `<h1>Fill a form</h1><p class="sub">Answer the questions, then send the summary to a chat.</p>
 <div class="chips">${S.tpls.map(x=>`<button class="chip ${x.id===S.cur?'on':''}" data-act="tpl" data-id="${x.id}">${esc((x.emoji||'')+' '+x.name)}</button>`).join('')}</div>
 <div class="card">${t.fields.length?t.fields.map(fieldHtml).join(''):'<div class="empty">This template has no fields yet.</div>'}
 <div class="row" style="margin-top:14px"><button data-act="clear">Clear form</button></div></div>
 <div class="card"><h2>Message</h2>
 <textarea id="out" aria-label="Message to send">${esc(build(t,S.vals))}</textarea>
 <div class="row" style="margin-top:10px"><button class="line" data-act="send" data-k="line">Send to LINE</button><button class="wa" data-act="send" data-k="wa">WhatsApp</button></div>
 <div class="row" style="margin-top:8px"><button data-act="send" data-k="copy">Copy text</button>${navigator.share?'<button data-act="send" data-k="more">More…</button>':''}<button id="rst" data-act="reset" ${S.dirty?'':'hidden'}>Reset text</button></div>
 <p class="sub" style="margin:10px 0 0">You can edit the message before sending.</p></div>`}

function viewTpls(){
 return `<h1>Templates</h1><p class="sub">Define the questions once, reuse them every time.</p>
 <div class="card">${S.tpls.length?S.tpls.map(t=>`<div class="item"><div class="t"><b>${esc((t.emoji||'')+' '+t.name)}</b><small>${t.fields.length} fields</small></div><button class="sm" data-act="edit" data-id="${t.id}">Edit</button></div>`).join(''):'<div class="empty">Nothing here yet.</div>'}
 <div class="row" style="margin-top:10px"><button class="pri" data-act="new">New template</button></div></div>
 <div class="card"><h2>Import a template</h2><textarea id="imp" rows="3" placeholder="Paste a template code here"></textarea><div class="row" style="margin-top:8px"><button data-act="import">Import</button></div></div>`}

function viewEdit(){
 const e=S.edit;
 return `<h1>${S.tpls.some(t=>t.id===e.id)?'Edit template':'New template'}</h1><p class="sub">Each field becomes a question in the form and a line in the message.</p>
 <div class="card"><div class="row"><div style="flex:3"><label for="bn">Template name</label><input id="bn" type="text" data-b="name" value="${esc(e.name)}"></div><div style="flex:1"><label for="be">Emoji</label><input id="be" type="text" data-b="emoji" value="${esc(e.emoji)}"></div></div>
 <label class="chk"><input type="checkbox" data-b="stamp" ${e.stamp?'checked':''}> Add date and time at the end of the message</label></div>
 <div class="card"><h2>Fields</h2>
 ${e.fields.map((f,i)=>`<div class="frow"><input type="text" aria-label="Field label" placeholder="Question or label" data-bf="${i}:label" value="${esc(f.label)}">
 <div class="row"><select aria-label="Field type" data-bf="${i}:type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${f.type===k?'selected':''}>${v}</option>`).join('')}</select></div>
 ${f.type==='select'?`<div class="row"><input type="text" aria-label="Dropdown choices" placeholder="Choices, separated by commas" data-bf="${i}:opts" value="${esc(f.opts)}"></div>`:''}
 <div class="row">${f.type!=='check'?`<label class="chk fix" style="margin:0"><input type="checkbox" data-bf="${i}:req" ${f.req?'checked':''}> Required</label>`:'<span></span>'}
 <button class="sm fix" data-act="up" data-i="${i}" aria-label="Move up">↑</button><button class="sm fix" data-act="dn" data-i="${i}" aria-label="Move down">↓</button><button class="sm fix del" data-act="rmf" data-i="${i}">Remove</button></div></div>`).join('')}
 <button data-act="addf" style="width:100%">Add field</button></div>
 <div class="row"><button class="pri" data-act="savet">Save template</button><button data-act="cancel">Cancel</button></div>
 <div class="row" style="margin-top:8px"><button data-act="export">Copy template code</button>${S.tpls.some(t=>t.id===e.id)?'<button class="del" data-act="delt">Delete</button>':''}</div>`}

function viewHist(){
 return `<h1>History</h1><p class="sub">Messages you sent or copied. Stored on this device only.</p>
 ${S.hist.length?S.hist.map((h,i)=>`<div class="card"><b>${esc(h.name)}</b> <small style="color:var(--mut)">${esc(h.ts)}</small><pre>${esc(h.text)}</pre>
 <div class="row"><button class="line sm" data-act="hsend" data-k="line" data-i="${i}">LINE</button><button class="wa sm" data-act="hsend" data-k="wa" data-i="${i}">WhatsApp</button><button class="sm" data-act="hsend" data-k="copy" data-i="${i}">Copy</button><button class="sm del" data-act="hdel" data-i="${i}">Delete</button></div></div>`).join(''):'<div class="empty">Nothing sent yet.</div>'}`}

function render(){
 const v=S.view;
 $('#app').innerHTML=v==='edit'?viewEdit():v==='job'?viewJob():v==='tpls'?viewTpls():v==='hist'?viewHist():viewFill();
 const tab=v==='edit'?'tpls':v;
 $('#nav').innerHTML=[['fill','Fill'],['job','Job'],['tpls','Templates'],['hist','History']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-act="nav" data-v="${k}">${l}</button>`).join('')}

function copyText(t){
 if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(()=>toast('Copied'),()=>fb(t));
 fb(t)}
function fb(t){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast('Copied')}catch(e){toast('Copy failed')}a.remove()}
function deliver(k,text){
 const q=encodeURIComponent(text);
 if(k==='copy')return copyText(text);
 if(k==='more')return navigator.share({text}).catch(()=>{});
 const u=k==='line'?'https://line.me/R/msg/text/?'+q:'https://wa.me/?text='+q;
 window.open(u,'_blank')||(location.href=u)}
function logH(t,text){const d=new Date();S.hist.unshift({name:t.name,text,ts:fmtD(today())+' '+nowT()});S.hist=S.hist.slice(0,40);save()}


const ICON={depart:'🚗',arrive:'🏁',delay:'⚠️',fix:'🔧',pause:'⏸️',continue:'▶️',close:'✅'};
const NAME={depart:'Depart',arrive:'Arrive',delay:'Delay',fix:'Fix issue',pause:'Pause',continue:'Continue',close:'Close job'};
const PAST={depart:'Departed',arrive:'Arrived',delay:'Delay',fix:'Fixing issue',pause:'Paused',continue:'Continued',close:'Closed'};
const STAT={new:'Not started',travel:'Traveling to site',onsite:'On site',fixing:'Fixing issue',paused:'Paused',closed:'Closed'};
const NEXT={new:['depart'],travel:['arrive','delay'],onsite:['fix','delay','pause','close'],fixing:['delay','pause','close'],paused:['continue'],closed:[]};
const saveJ=()=>store.set('f2c_j',S.job);
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const dkey=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dur=ms=>{const m=Math.max(0,Math.round(ms/6e4));return m>=60?Math.floor(m/60)+'h '+pad(m%60)+'m':m+'m'};
const mapUrl=e=>'https://maps.google.com/?q='+e.lat+','+e.lon;
const LOCRE=/(-?\d+(\.\d+)?)\s*[, ]\s*(-?\d+(\.\d+)?)/;
function stat(j){let s='new',p=null;for(const e of j.events){if(e.k==='depart')s='travel';else if(e.k==='arrive')s='onsite';else if(e.k==='fix')s='fixing';else if(e.k==='pause'){p=s;s='paused'}else if(e.k==='continue')s=p||'onsite';else if(e.k==='close')s='closed'}return s}
function etaOf(j){let t=null;j.events.forEach(e=>{if((e.k==='depart'||e.k==='delay')&&e.eta)t=e.eta});return t}
function steps(j){let eta=null;return j.events.map(e=>{let x='';
 if(e.k==='depart'){eta=e.eta;x=' (ETA '+e.min+' min, at '+hm(e.eta)+')'}
 else if(e.k==='delay'){if(e.min)x=' (+'+e.min+' min'+(e.eta?', new ETA '+hm(e.eta):'')+')';if(e.eta)eta=e.eta}
 else if(e.k==='arrive'&&eta){const d=Math.round((e.ts-eta)/6e4);x=d>1?' (late '+d+' min)':d<-1?' (early '+(-d)+' min)':' (on time)'}
 return{e,head:ICON[e.k]+' '+PAST[e.k]+' '+hm(e.ts)+x,loc:e.lat!=null?e.lat+', '+e.lon:''}})}
function totals(j){const ev=j.events,end=stat(j)==='closed'?ev[ev.length-1].ts:Date.now();let dep,arr,paused=0,ps=null;
 ev.forEach(e=>{if(e.k==='depart'&&!dep)dep=e.ts;if(e.k==='arrive'&&!arr)arr=e.ts;if(e.k==='pause')ps=e.ts;if(e.k==='continue'&&ps){paused+=e.ts-ps;ps=null}});
 if(ps)paused+=end-ps;
 const o=[];if(dep&&arr)o.push('Travel: '+dur(arr-dep));if(arr)o.push('On site: '+dur(end-arr-paused));if(paused)o.push('Paused: '+dur(paused));o.push('Total: '+dur(end-ev[0].ts));return o}
function jobText(j){
 const name='🛠️ Job: '+(j.title||'(no name)');
 if(!j.events.length)return name+'\nNo steps recorded yet.';
 const L=[name,'Date: '+fmtD(dkey(j.events[0].ts)),'Status: '+STAT[stat(j)],''];
 steps(j).forEach(x=>{L.push(x.head);if(x.e.note)L.push('   '+x.e.note.replace(/\n/g,'\n   '));if(x.loc)L.push('   📌 '+x.loc+'\n   '+mapUrl(x.e))});
 L.push('',...totals(j));
 let t=L.join('\n');
 if(S.incl&&tpl())t+='\n\n'+build(tpl(),S.vals);
 return t.trim()}
function getLoc(){return new Promise(r=>{if(!navigator.geolocation)return r(null);try{navigator.geolocation.getCurrentPosition(p=>r({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)}),()=>r(null),{enableHighAccuracy:true,timeout:10000,maximumAge:30000})}catch(e){r(null)}})}
async function askLoc(){const p=S.panel;if(!p)return;const m=$('#pmsg');if(m)m.textContent='Getting your location…';
 const r=await getLoc();if(S.panel!==p)return;
 if(r){p.loc=r.lat.toFixed(6)+', '+r.lon.toFixed(6);p.msg='Location found (accuracy about '+r.acc+' m)'}
 else p.msg='Location unavailable. Allow location access, or type lat, long below.';
 const i=$('#ploc');if(i)i.value=p.loc;const m2=$('#pmsg');if(m2)m2.textContent=p.msg}
function rec(){const p=S.panel,j=S.job,ev={k:p.k,ts:Date.now(),note:(p.note||'').trim()};
 const m=parseInt(p.min,10);if(m>0)ev.min=m;
 const mm=(p.loc||'').match(LOCRE);if(mm){ev.lat=+mm[1];ev.lon=+mm[3]}
 if(p.k==='depart'){if(!ev.min)return toast('Enter the minutes to reach the site');ev.eta=ev.ts+ev.min*6e4}
 if(p.k==='delay'){if(!ev.min&&!ev.note)return toast('Add a reason or extra minutes');if(ev.min&&stat(j)==='travel')ev.eta=(etaOf(j)||ev.ts)+ev.min*6e4}
 j.events.push(ev);S.panel=null;saveJ();render()}
function panelHtml(p){const k=p.k,q={depart:'Minutes to reach the site',delay:'Extra minutes (optional)'},
 nl={depart:'Note (optional)',arrive:'Note (optional)',delay:'Reason',fix:'What are you fixing?',pause:'Reason for pausing',continue:'Note (optional)',close:'Result and what was done'};
 return `<div class="card"><h2>${ICON[k]} ${NAME[k]}</h2>
 ${q[k]?`<label for="pm">${q[k]}${k==='depart'?'<b class="rq"> *</b>':''}</label><input id="pm" type="number" inputmode="numeric" data-p="min" value="${esc(p.min)}">`:''}
 <label for="pn">${nl[k]}</label><textarea id="pn" rows="2" data-p="note">${esc(p.note)}</textarea>
 <label for="ploc">Location (lat, long)</label><input id="ploc" type="text" data-p="loc" value="${esc(p.loc)}" placeholder="13.756300, 100.501800">
 <p class="sub" id="pmsg" style="margin:6px 0 0">${esc(p.msg||'')}</p>
 <div class="row" style="margin-top:12px"><button class="pri" data-act="rec">Save step</button><button data-act="locget">Get location again</button><button data-act="pcancel">Cancel</button></div></div>`}
function viewJob(){
 const j=S.job,s=stat(j),eta=etaOf(j),nx=NEXT[s],p=S.panel;
 if(S.tpls.length&&!tpl())open(S.tpls[0].id);
 let h=`<h1>Job tracker</h1><p class="sub">Log each step with time and location, then share the summary.</p>
 <div class="card"><label for="jt">Job or site name</label><input id="jt" type="text" data-j="title" value="${esc(j.title)}" placeholder="e.g. BKK1234 power alarm">
 <p style="margin:12px 0 0"><span class="pill">${STAT[s]}</span></p>`;
 if(s==='travel'&&eta){const d=Math.round((eta-Date.now())/6e4);h+=`<p class="eta">Expected arrival ${hm(eta)} ${d>=0?'(in '+d+' min)':'(overdue by '+(-d)+' min)'}</p>`}
 h+='</div>';
 if(p)h+=panelHtml(p);
 else if(nx.length)h+=`<div class="card"><h2>Next step</h2><div class="grid">${nx.map((k,i)=>`<button class="${i===0?'pri':''}" data-act="step" data-k="${k}">${ICON[k]} ${NAME[k]}</button>`).join('')}</div></div>`;
 else h+=`<div class="card"><h2>Job closed</h2><p class="sub" style="margin:0">Share the summary below or start a new job.</p></div>`;
 if(j.events.length)h+=`<div class="card"><h2>Timeline</h2><div class="tl">${steps(j).map(x=>`<div><b>${esc(x.head)}</b>${x.e.note?`<small style="color:var(--ink)">${esc(x.e.note)}</small>`:''}${x.loc?`<small>📌 <a href="${mapUrl(x.e)}" target="_blank" rel="noopener">${x.loc}</a></small>`:'<small>No location</small>'}</div>`).join('')}</div>
 <div class="row" style="margin-top:10px"><button class="sm del" data-act="undo">Undo last step</button></div></div>`;
 h+=`<div class="card"><h2>Summary</h2><textarea id="jout" aria-label="Job summary">${esc(jobText(j))}</textarea>
 ${tpl()?`<label class="chk"><input type="checkbox" id="incl" ${S.incl?'checked':''}> Add the "${esc(tpl().name)}" form message</label>`:''}
 <div class="row" style="margin-top:6px"><button class="line" data-act="jsend" data-k="line">Send to LINE</button><button class="wa" data-act="jsend" data-k="wa">WhatsApp</button></div>
 <div class="row" style="margin-top:8px"><button data-act="jsend" data-k="copy">Copy text</button>${navigator.share?'<button data-act="jsend" data-k="more">More…</button>':''}<button data-act="newjob">New job</button></div></div>`;
 const g=gcfg();
 h+=`<div class="card"><h2>Google Sheet</h2><p class="sub" style="margin:0 0 10px">Keeps one row per job. Tap again after each new step to refresh that row.</p>
 <div class="row"><button class="pri" data-act="sheet">Update Google Sheet</button><button data-act="rowcopy">Copy row</button></div>
 ${S.slink?`<div class="frow" style="margin-top:10px"><p class="sub" style="margin:0 0 8px">Link ready. If no tab opened, tap Open link, or copy it and paste it into your phone browser address bar.</p><div class="row"><a class="btn" href="${esc(S.slink)}" target="_blank" rel="noopener">Open link</a><button data-act="lcopy">Copy link</button></div><textarea readonly rows="3" style="margin-top:8px;font-size:13px" aria-label="Link">${esc(S.slink)}</textarea></div>`:''}
 <details style="margin-top:8px"><summary>Sheet settings</summary><p class="sub" style="margin:0">Copy Apps Script gives version v4. Its first line says v4.</p>
 <label for="gu">Web app URL</label><input id="gu" type="text" data-g="url" value="${esc(g.url||'')}" placeholder="https://script.google.com/macros/s/…/exec">
 <label for="gk">Secret key</label><input id="gk" type="password" autocomplete="off" data-g="key" value="${esc(g.key||'')}">
 <div class="row" style="margin-top:10px"><button data-act="scriptcopy">Copy Apps Script</button><button data-act="stest">Test connection</button></div><div class="row" style="margin-top:8px"><button class="del" data-act="erase">Erase all data on this device</button></div></details></div>`;
 const fl=store.get('f2c_forms',[]);
 h+=`<div class="card"><h2>Google Forms</h2><p class="sub" style="margin:0 0 10px">Fill your other Google Forms with this job's details. You check the answers and tap Submit in the form.</p>
 ${fl.length?fl.map((f,i)=>`<div class="item"><div class="t"><b>${esc(f.name)}</b></div><button class="sm pri" data-act="fopen" data-i="${i}">Open filled form</button><button class="sm del" data-act="fdel" data-i="${i}" aria-label="Remove form">Remove</button></div>`).join(''):'<div class="empty" style="padding:8px">No forms yet.</div>'}
 ${S.flink?`<div class="frow" style="margin-top:10px"><p class="sub" style="margin:0 0 8px">Form link ready. If no tab opened, tap Open link, or copy it into your phone browser.</p><div class="row"><a class="btn" href="${esc(S.flink)}" target="_blank" rel="noopener">Open link</a><button data-act="fcopy">Copy link</button></div></div>`:''}
 <details style="margin-top:8px"><summary>Add a form</summary>
 <label for="fn">Form name</label><input id="fn" type="text" data-fn="name" placeholder="e.g. Site visit checklist">
 <label for="fu">Pre-filled link with tokens</label><textarea id="fu" rows="3" data-fn="url" placeholder="https://docs.google.com/forms/d/e/…/viewform?usp=pp_url&entry.123={title}"></textarea>
 <div class="row" style="margin-top:10px"><button data-act="fadd">Save form</button></div>
 <p class="sub" style="margin:10px 0 0">In Google Forms tap ⋮ → Get pre-filled link. Type a token like {title} into each answer, tap Get link, copy it, and paste it here.<br>Tokens: {title} {status} {date} {departed} {eta} {arrived} {closed} {travel} {onsite} {paused} {total} {loc} {lat} {lon} {map} {summary} {now}. For answers from the Fill tab use {f:Label}, for example {f:Site ID}.<br>For date or time questions, in the copied link replace the numbers after _year, _month, _day, _hour and _minute with {year} {month} {day} {hour} {minute}.</p></details></div>`;
 return h}


const COLS=['id','title','status','date','departed','eta','arrived','closed','travel','onsite','paused','total','loc','map','updated','summary'];
const GS=[
"// Form2Chat script v4 (signed requests)",
"const KEY = 'change-me'; // set your own long secret, same as in the app",
"const SHEET = 'Jobs';",
"const COLS = "+JSON.stringify(COLS).replace(/"/g,"'")+";",
"function safe(v) { v = String(v || ''); return /^[=+\\-@]|^\\d{1,2}:\\d\\d$/.test(v) ? \"'\" + v : v; }",
"function hex(b) { return b.map(x => ('0' + (x & 255).toString(16)).slice(-2)).join(''); }",
"function same(a, b) { if (a.length !== b.length) return false; let r = 0; for (let i = 0; i < a.length; i++) r |= a.charCodeAt(i) ^ b.charCodeAt(i); return r === 0; }",
"function auth(p) {",
"  if (KEY === 'change-me') return 'Set your own KEY in the script first.';",
"  const cache = CacheService.getScriptCache();",
"  if (Number(cache.get('fails') || 0) >= 10) return 'Too many failed attempts. Try again in 10 minutes.';",
"  const msg = p.ts + '|' + (p.test || '') + '|' + JSON.stringify(COLS.map(c => p[c] || ''));",
"  const ok = p.sig && p.ts && Math.abs(Date.now() - Number(p.ts)) < 600000 && same(hex(Utilities.computeHmacSha256Signature(msg, KEY)), String(p.sig));",
"  if (ok) return '';",
"  cache.put('fails', String(Number(cache.get('fails') || 0) + 1), 600);",
"  return 'Not allowed. Check the secret key and your phone clock.';",
"}",
"function handle(p) {",
"  const bad = auth(p);",
"  if (bad) return bad;",
"  const ss = SpreadsheetApp.getActiveSpreadsheet();",
"  if (!ss) return 'Script is not attached to a sheet. Open it from the sheet: Extensions > Apps Script.';",
"  if (p.test) return 'Connected (script v4). Key OK. Spreadsheet: ' + ss.getName();",
"  if (!p.id) return 'Missing job id.';",
"  const lock = LockService.getScriptLock();",
"  lock.waitLock(10000);",
"  try {",
"    const sh = ss.getSheetByName(SHEET) || ss.insertSheet(SHEET);",
"    if (sh.getLastRow() === 0) sh.appendRow(COLS);",
"    const row = COLS.map(c => safe(String(p[c] || '').slice(0, c === 'summary' ? 5000 : 500)));",
"    const n = sh.getLastRow() - 1;",
"    const ids = n > 0 ? sh.getRange(2, 1, n, 1).getValues().flat() : [];",
"    const i = ids.indexOf(row[0]);",
"    if (i >= 0) sh.getRange(i + 2, 1, 1, row.length).setValues([row]); else sh.appendRow(row);",
"  } finally { lock.releaseLock(); }",
"  return 'Job updated in Google Sheet. You can close this tab.';",
"}",
"function out(t) { return HtmlService.createHtmlOutput('<meta name=\"viewport\" content=\"width=device-width\"><body style=\"font:20px sans-serif;padding:24px\">' + t + '</body>'); }",
"function doGet(e) { try { return out(handle(e.parameter)); } catch (err) { return out('Error: ' + err); } }",
"function doPost(e) { return doGet(e); }"
].join('\n');
function sheetData(j){
 const ev=j.events,T=totals(j),now=Date.now(),f=k=>ev.find(e=>e.k===k),last=[...ev].reverse().find(e=>e.lat!=null);
 const g=l=>{const x=T.find(t=>t.startsWith(l+': '));return x?x.slice(l.length+2):''};
 return{id:'J-'+j.id,title:j.title||'',status:STAT[stat(j)],date:dkey(ev[0].ts),
  departed:f('depart')?hm(f('depart').ts):'',eta:etaOf(j)?hm(etaOf(j)):'',arrived:f('arrive')?hm(f('arrive').ts):'',closed:f('close')?hm(f('close').ts):'',
  travel:g('Travel'),onsite:g('On site'),paused:g('Paused'),total:g('Total'),
  loc:last?last.lat+', '+last.lon:'',map:last?mapUrl(last):'',updated:dkey(now)+' '+hm(now),summary:jobText(j)}}
function tokenMap(){
 const j=S.job,d=sheetData(j),m={};
 Object.keys(d).forEach(k=>m[k]=d[k]);
 const ll=(d.loc||'').split(',').map(x=>x.trim());m.lat=ll[0]||'';m.lon=ll[1]||'';
 m.now=fmtD(today())+' '+nowT();
 const dt=d.date.split('-').map(Number);m.year=dt[0];m.month=dt[1];m.day=dt[2];
 const ld=new Date(j.events[j.events.length-1].ts);m.hour=ld.getHours();m.minute=ld.getMinutes();
 if(tpl())tpl().fields.forEach(f=>{let x=S.vals[f.id];if(f.type==='check')x=x?'Yes':'No';else if(f.type==='date')x=fmtD(x);x=x==null?'':x;const k=f.label.trim().toLowerCase();m['f:'+k]=x;if(!(k in m))m[k]=x});
 return m}
function fillUrl(t,vals){
 const m=t.match(/^([^?#]*)\?([^#]*)(#.*)?$/);if(!m)return t;
 const ps=m[2].split('&').map(kv=>{const i=kv.indexOf('=');if(i<0)return kv;const k=kv.slice(0,i);let v=kv.slice(i+1).replace(/\+/g,' ');
  try{v=decodeURIComponent(v)}catch(e){}
  v=v.replace(/\{([^}]+)\}/g,(x,n)=>{const r=vals[n.trim().toLowerCase()];return r===undefined?'':r});
  return k+'='+encodeURIComponent(v)});
 return m[1]+'?'+ps.join('&')+(m[3]||'')}
async function hmac(key,msg){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(key),{name:'HMAC',hash:'SHA-256'},false,['sign']);const b=await crypto.subtle.sign('HMAC',k,new TextEncoder().encode(msg));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('')}
async function toSheet(test){
 const g=gcfg(),j=S.job;
 if(!g.url)return toast('Add your Web app URL in Sheet settings');
 if(!/\/exec(\?|$)/.test(g.url))return toast('The URL must end with /exec');
 if(!g.key||g.key==='change-me')return toast('Set your own secret key in the app and in the script');
 if(!(window.crypto&&crypto.subtle))return toast('This needs a secure https page');
 let d;
 if(test)d={test:'1'};else{if(!j.events.length)return toast('Record a step first');d=sheetData(j)}
 const sign=async o=>{o.ts=String(Date.now());o.sig=await hmac(g.key,o.ts+'|'+(o.test||'')+'|'+JSON.stringify(COLS.map(c=>String(o[c]||''))));return o};
 const full=await sign(Object.assign({},d));
 const mk=()=>g.url+(g.url.includes('?')?'&':'?')+Object.keys(d).map(k=>k+'='+encodeURIComponent(d[k])).join('&');
 let u=mk(),cut=false;
 while(u.length>6800&&d.summary){d.summary=d.summary.slice(0,Math.floor(d.summary.length*.8));cut=true;u=mk()}
 await sign(d);u=mk();
 const link=()=>{try{window.open(u,'_blank')}catch(e){}S.slink=u;render();toast(cut?'Link ready. Summary was shortened to fit':'Link ready below')};
 if(test)return link();
 toast('Sending…');
 fetch(g.url,{method:'POST',mode:'no-cors',body:new URLSearchParams(full)}).then(()=>{S.slink=null;render();toast('Sent. If the row did not change, tap Test connection')},link)}

document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset.fn){S.fnew=S.fnew||{};S.fnew[el.dataset.fn]=el.value;return}
 if(el.dataset.g){const g=store.get('f2c_g',{});g[el.dataset.g]=el.value.trim();store.set('f2c_g',g);return}
 if(el.dataset.j){S.job.title=el.value;saveJ();const o=$('#jout');if(o)o.value=jobText(S.job);return}
 if(el.dataset.p){S.panel[el.dataset.p]=el.value;return}
 if(el.id==='incl'){S.incl=el.checked;$('#jout').value=jobText(S.job);return}
 if(el.dataset.f){const f=tpl().fields.find(x=>x.id===el.dataset.f);S.vals[f.id]=f.type==='check'?el.checked:el.value;if(!S.dirty)$('#out').value=build(tpl(),S.vals);return}
 if(el.id==='out'){S.dirty=true;$('#rst').hidden=false;return}
 if(el.dataset.b){S.edit[el.dataset.b]=el.type==='checkbox'?el.checked:el.value;return}
 if(el.dataset.bf){const[i,k]=el.dataset.bf.split(':');S.edit.fields[i][k]=el.type==='checkbox'?el.checked:el.value}});
document.addEventListener('change',e=>{
 const el=e.target;
 if(el.dataset.bf&&el.dataset.bf.endsWith(':type'))render()});

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-act]');if(!b)return;
 const a=b.dataset.act,i=+b.dataset.i,id=b.dataset.id;
 if(a==='nav'){S.view=b.dataset.v;S.edit=null;render()}
 else if(a==='tpl'){open(id);render()}
 else if(a==='sheet')toSheet();
 else if(a==='stest')toSheet(true);
 else if(a==='erase'){if(!confirm('Erase all templates, history, the current job and Sheet settings on this device?'))return;try{localStorage.clear()}catch(x){}location.reload()}
 else if(a==='lcopy')copyText(S.slink);
 else if(a==='fcopy')copyText(S.flink);
 else if(a==='fadd'){const n=S.fnew||{},nm=(n.name||'').trim(),u=(n.url||'').trim();
  if(!nm)return toast('Give the form a name');
  if(!/^https:\/\/(docs\.google\.com\/forms\/|forms\.gle\/)/.test(u))return toast('Paste a Google Forms link');
  const fl=store.get('f2c_forms',[]);fl.push({id:uid(),name:nm,url:u});store.set('f2c_forms',fl);S.fnew={};render();toast('Form saved')}
 else if(a==='fdel'){const fl=store.get('f2c_forms',[]);fl.splice(i,1);store.set('f2c_forms',fl);S.flink=null;render()}
 else if(a==='fopen'){if(!S.job.events.length)return toast('Record a step first');
  const f=store.get('f2c_forms',[])[i];if(!f)return;const u=fillUrl(f.url,tokenMap());
  try{window.open(u,'_blank')}catch(x){}S.flink=u;render();toast('Form link ready below')}
 else if(a==='rowcopy'){if(!S.job.events.length)return toast('Record a step first');const d=sheetData(S.job);copyText(COLS.map(c=>String(d[c]).replace(/\n/g,' / ')).join('\t'))}
 else if(a==='scriptcopy')copyText(GS);
 else if(a==='step'){S.panel={k:b.dataset.k,min:'',note:'',loc:'',msg:''};render();askLoc()}
 else if(a==='locget')askLoc();
 else if(a==='pcancel'){S.panel=null;render()}
 else if(a==='rec')rec();
 else if(a==='undo'){S.job.events.pop();saveJ();render()}
 else if(a==='newjob'){if(S.job.events.length&&stat(S.job)!=='closed'&&!confirm('Discard this unfinished job?'))return;S.job={id:uid(),title:'',events:[]};S.panel=null;saveJ();render()}
 else if(a==='jsend'){const text=$('#jout').value;logH({name:'Job: '+(S.job.title||'untitled')},text);deliver(b.dataset.k,text)}
 else if(a==='clear'){open(S.cur);render()}
 else if(a==='reset'){S.dirty=false;$('#out').value=build(tpl(),S.vals);b.hidden=true}
 else if(a==='send'){
  const t=tpl(),miss=t.fields.filter(f=>f.req&&f.type!=='check'&&!S.vals[f.id]);
  if(miss.length)return toast('Fill in: '+miss.map(f=>f.label).join(', '));
  const text=$('#out').value;logH(t,text);deliver(b.dataset.k,text)}
 else if(a==='hsend')deliver(b.dataset.k,S.hist[i].text);
 else if(a==='hdel'){S.hist.splice(i,1);save();render()}
 else if(a==='new'){S.edit={id:uid(),name:'',emoji:'📋',stamp:false,fields:[F('','text')]};S.view='edit';render()}
 else if(a==='edit'){S.edit=JSON.parse(JSON.stringify(S.tpls.find(t=>t.id===id)));S.view='edit';render()}
 else if(a==='addf'){S.edit.fields.push(F('','text'));render()}
 else if(a==='rmf'){S.edit.fields.splice(i,1);render()}
 else if(a==='up'&&i>0){const f=S.edit.fields;[f[i-1],f[i]]=[f[i],f[i-1]];render()}
 else if(a==='dn'&&i<S.edit.fields.length-1){const f=S.edit.fields;[f[i+1],f[i]]=[f[i],f[i+1]];render()}
 else if(a==='cancel'){S.view='tpls';S.edit=null;render()}
 else if(a==='savet'){
  const e2=S.edit;if(!e2.name.trim())return toast('Give the template a name');
  e2.fields=e2.fields.filter(f=>f.label.trim());
  const k=S.tpls.findIndex(t=>t.id===e2.id);k>=0?S.tpls[k]=e2:S.tpls.push(e2);
  save();open(e2.id);S.view='fill';S.edit=null;render();toast('Template saved')}
 else if(a==='delt'){if(!confirm('Delete this template?'))return;S.tpls=S.tpls.filter(t=>t.id!==S.edit.id);S.cur=null;save();S.view='tpls';S.edit=null;render()}
 else if(a==='export')copyText(JSON.stringify(S.edit));
 else if(a==='import'){
  try{const t=JSON.parse($('#imp').value.trim());if(!t.name||!Array.isArray(t.fields))throw 0;t.id=uid();S.tpls.push(t);save();render();toast('Template imported')}catch(x){toast('That code is not a valid template')}}});

render();
